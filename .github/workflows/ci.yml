name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore PhotoMigration.slnx

      - name: Build
        run: dotnet build PhotoMigration.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test PhotoMigration.slnx --configuration Release --no-build
